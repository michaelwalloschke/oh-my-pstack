name: CI

on:
  pull_request:
  push:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-26.04
    timeout-minutes: 20
    steps:
      - name: Check out package
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 26.x
          check-latest: true
          package-manager-cache: false
      - name: Verify package
        run: npm run verify
      - name: Run credential-free unit tests
        run: node --test scripts/verify.test.mjs scripts/sync-upstream.test.mjs scripts/sync-proposal.test.mjs scripts/omp-rpc.test.mjs scripts/omp-provenance.test.mjs scripts/package.test.mjs scripts/worktree-audit.test.mjs
      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
      - name: Test bundled scripts
        run: |
          bun install --cwd skills/poteto-mode/scripts --frozen-lockfile
          bun test orch watch-pr check-plan.test.ts
          bun run --cwd skills/poteto-mode/scripts typecheck
