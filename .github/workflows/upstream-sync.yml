name: Sync upstream pstack

on:
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: upstream-pstack-sync
  cancel-in-progress: false

jobs:
  candidate:
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    outputs:
      changed: ${{ steps.update.outputs.changed }}
      base: ${{ steps.base.outputs.sha }}
      source-commit: ${{ steps.proposal.outputs.source-commit }}
      source-version: ${{ steps.proposal.outputs.source-version }}
    steps:
      - name: Check out package
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - id: base
        name: Record validation base
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 26.x
          check-latest: true
          package-manager-cache: false
      - id: update
        name: Apply upstream update and detect owned changes
        run: |
          status=0
          node scripts/sync-upstream.mjs --apply || status=$?
          if [[ "$status" -eq 2 ]]; then
            review="${RUNNER_TEMP}/pstack-review"
            node scripts/sync-upstream.mjs --export-review "$review"
            node --input-type=module - "$review" <<'NODE'
          import { appendFileSync, readFileSync, writeFileSync } from "node:fs";
          import { join } from "node:path";
          import { execFileSync } from "node:child_process";
          const review = process.argv[2];
          const manifest = JSON.parse(readFileSync(join(review, "manifest.json"), "utf8"));
          const conflicts = manifest.entries.filter(entry => entry.outcome.kind === "conflict");
          if (!conflicts.length) throw new Error("Apply exited 2 but review export contains no conflicts.");
          const base = execFileSync("git", ["rev-parse", "HEAD"], { encoding: "utf8" }).trim();
          const summary = [
            "## Upstream sync needs manual review",
            "",
            `${conflicts.length} conflicts require explicit decisions. No managed files or lock were changed. No update PR will be opened.`,
            "",
            `Validation base: ${base}`,
            `Pinned upstream: ${manifest.lock.commit}`,
            `Incoming upstream: ${manifest.commit}`,
            "",
            "Download the upstream-review artifact from this run. It contains manifest.json and entries/<id>/{base,local,incoming,proposal}.txt snapshots where present.",
            "",
            ...conflicts.map(entry => `- ${JSON.stringify(entry.path)} (entry ${entry.id}): ${entry.outcome.reason}`),
            "",
            "In a disposable checkout of the validation base, keep the downloaded review directory outside the checkout. Use an upstream source checkout at the incoming commit with --source DIR so later upstream changes cannot change the reviewed input.",
            'For each conflicting manifest entry, set decision to {"kind":"write","reason":"..."} and save the resolved text without conflict markers as entries/<id>/resolved.txt. For deletion, use {"kind":"delete","reason":"..."}. Reasons must be nonempty. Leave other entries unchanged.',
            "",
            "Run `node scripts/sync-upstream.mjs --apply --review /path/to/pstack-review --source /path/to/upstream-source --dry-run`. Inspect the result, then remove --dry-run to apply and run package verification before proposing the changes.",
            "",
          ].join("\n");
          writeFileSync(join(review, "review-summary.md"), summary);
          appendFileSync(process.env.GITHUB_STEP_SUMMARY, summary);
          NODE
            echo "::warning::Upstream conflicts require manual review. Download the upstream-review artifact and follow the job summary."
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "review-required=true" >> "$GITHUB_OUTPUT"
            exit 0
          elif [[ "$status" -ne 0 ]]; then
            exit "$status"
          fi
          if [[ -n "$(git status --porcelain --untracked-files=all -- ':(exclude)skills' ':(exclude)upstream.lock.json' ':(exclude)**/node_modules/**')" ]]; then
            echo "Sync changed files outside proposal ownership." >&2
            git status --porcelain
            exit 1
          fi
          if [[ -n "$(git status --porcelain --untracked-files=all -- skills upstream.lock.json ':(exclude)**/node_modules/**')" ]]; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
          fi
      - if: steps.update.outputs.review-required == 'true'
        name: Upload conflict review artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: upstream-review
          path: ${{ runner.temp }}/pstack-review
          if-no-files-found: error
          include-hidden-files: false
          retention-days: 14
      - if: steps.update.outputs.changed == 'true'
        name: Verify package
        run: |
          npm run verify
          npm run test:verify
      - if: steps.update.outputs.changed == 'true'
        name: Test updater and proposal intake
        run: |
          npm run test:sync
          npm run test:proposal
          node --test scripts/worktree-audit.test.mjs
      - if: steps.update.outputs.changed == 'true'
        name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
      - if: steps.update.outputs.changed == 'true'
        name: Test bundled scripts
        run: |
          bun install --cwd skills/poteto-mode/scripts --frozen-lockfile
          bun test orch watch-pr check-plan.test.ts
          bun run --cwd skills/poteto-mode/scripts typecheck
      - if: steps.update.outputs.changed == 'true'
        id: proposal
        name: Write bounded proposal artifact
        env:
          BASE_SHA: ${{ steps.base.outputs.sha }}
        run: |
          set -euo pipefail
          artifact="${RUNNER_TEMP}/pstack-proposal"
          mkdir -p "$artifact"
          git add --all -- skills upstream.lock.json ':(exclude)**/node_modules/**'
          git diff --cached --no-renames --binary HEAD -- skills upstream.lock.json > "$artifact/proposal.patch"
          if [[ ! -s "$artifact/proposal.patch" ]]; then
            echo "Owned changes produced an empty patch." >&2
            exit 1
          fi
          node --input-type=module -e '
            import { createHash } from "node:crypto";
            import { appendFileSync, readFileSync, writeFileSync } from "node:fs";
            const [patchPath, metadataPath, base, outputPath] = process.argv.slice(1);
            const patch = readFileSync(patchPath);
            const lock = JSON.parse(readFileSync("upstream.lock.json", "utf8"));
            writeFileSync(metadataPath, JSON.stringify({
              base,
              sourceCommit: lock.commit,
              sourceVersion: lock.version,
              patchSha256: createHash("sha256").update(patch).digest("hex"),
            }));
            appendFileSync(outputPath, `source-commit=${lock.commit}\nsource-version=${lock.version}\n`);
          ' "$artifact/proposal.patch" "$artifact/metadata.json" "$BASE_SHA" "$GITHUB_OUTPUT"
      - if: steps.update.outputs.changed == 'true'
        name: Upload proposal artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: upstream-proposal
          path: |
            ${{ runner.temp }}/pstack-proposal/proposal.patch
            ${{ runner.temp }}/pstack-proposal/metadata.json
          if-no-files-found: error
          include-hidden-files: false
          retention-days: 1

  propose:
    needs: candidate
    if: needs.candidate.outputs.changed == 'true'
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Check out trusted base
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Download proposal artifact
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: upstream-proposal
          path: ${{ runner.temp }}/pstack-proposal
      - name: Apply trusted proposal
        env:
          EXPECTED_BASE: ${{ github.sha }}
        run: node scripts/sync-proposal.mjs "${RUNNER_TEMP}/pstack-proposal" "$EXPECTED_BASE"
      - name: Open update pull request
        uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1 # v8.1.1
        with:
          token: ${{ github.token }}
          add-paths: |
            skills
            upstream.lock.json
            :(exclude)**/node_modules/**
          commit-message: "chore: sync upstream pstack"
          title: "chore: sync upstream pstack"
          body: |
            Automated proposal from the pinned authoritative Cursor pstack source.

            Base: `${{ needs.candidate.outputs.base }}`
            Source commit: `${{ needs.candidate.outputs.source-commit }}`
            Source version: `${{ needs.candidate.outputs.source-version }}`

            Adapted files are reconciled with a deterministic three-way merge.
            This pull request is an inspectable proposal, not an approved release.
            It is not merged automatically.
          branch: automation/upstream-pstack
          base: main
          delete-branch: true
